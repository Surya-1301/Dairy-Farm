name: Cleanup Android artifacts

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Android APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("DairyFarm-v1.0+")) | .id' |
          while read -r artifact_id; do
            [ -z "$artifact_id" ] || gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GH_REPO/actions/artifacts/$artifact_id"
          done
