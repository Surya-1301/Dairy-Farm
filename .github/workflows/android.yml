name: Android APK

on:
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Export build version
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_OWNER_EMAIL: ${{ secrets.VITE_OWNER_EMAIL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_RESET_SERVER_URL: ${{ secrets.VITE_RESET_SERVER_URL }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_RESET_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_RESET_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
        run: |
          missing=""
          for name in \
            VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID \
            VITE_FIREBASE_APP_ID VITE_FIREBASE_MEASUREMENT_ID VITE_OWNER_EMAIL \
            VITE_APP_URL VITE_RESET_SERVER_URL VITE_CLOUDINARY_CLOUD_NAME \
            VITE_CLOUDINARY_UPLOAD_PRESET VITE_EMAILJS_SERVICE_ID \
            VITE_EMAILJS_TEMPLATE_ID VITE_EMAILJS_RESET_TEMPLATE_ID \
            VITE_EMAILJS_PUBLIC_KEY
          do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required secrets present."

      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_OWNER_EMAIL: ${{ secrets.VITE_OWNER_EMAIL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_RESET_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_RESET_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_RESET_SERVER_URL: ${{ secrets.VITE_RESET_SERVER_URL }}

      - name: Sync Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          PYTHON_BIN=$(command -v python3 || command -v python)
          # Deep link: dairyfarm://auth — the default-browser Google bridge
          # redirects here with the custom token after account selection.
          "$PYTHON_BIN" - <<'EOF'
          import xml.etree.ElementTree as ET
          manifest = "android/app/src/main/AndroidManifest.xml"
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)
          tree = ET.parse(manifest)
          root = tree.getroot()
          activity = None
          for node in root.iter("activity"):
            if (node.get(f"{{{ns}}}name") or "") == ".MainActivity":
              activity = node
              break
          assert activity is not None, "MainActivity not found in AndroidManifest.xml"
          has_scheme = any(
            df.find("data") is not None and df.find("data").get(f"{{{ns}}}scheme") == "dairyfarm"
            for df in activity.findall("intent-filter")
          )
          if not has_scheme:
            intent_filter = ET.SubElement(activity, "intent-filter")
            ET.SubElement(intent_filter, "action", {f"{{{ns}}}name": "android.intent.action.VIEW"})
            ET.SubElement(intent_filter, "category", {f"{{{ns}}}name": "android.intent.category.DEFAULT"})
            ET.SubElement(intent_filter, "category", {f"{{{ns}}}name": "android.intent.category.BROWSABLE"})
            ET.SubElement(intent_filter, "data", {f"{{{ns}}}scheme": "dairyfarm"})
            tree.write(manifest, encoding="utf-8", xml_declaration=True)
            print("Added dairyfarm:// deep-link intent-filter.")
          else:
            print("dairyfarm:// deep-link already present.")
          EOF
          npx cap sync android

      - name: Pin debug signing + stamp version
        run: |
          # Same debug keystore on every build => new APKs upgrade-install
          # cleanly over the previously installed one (random runner keys
          # caused signature mismatches / "App not installed" silently).
          cp ci/debug.keystore android/app/debug.keystore
          PYTHON_BIN=$(command -v python3 || command -v python)
          "$PYTHON_BIN" - <<'EOF'
          import os, re, subprocess
          path = "android/app/build.gradle"
          src = open(path).read()
          sha = subprocess.check_output(["git", "rev-parse", "--short", "HEAD"]).decode().strip()
          run = os.environ.get("GITHUB_RUN_NUMBER", "1")
          src = re.sub(r"versionCode\s+\d+", "versionCode " + run, src)
          src = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.0+' + sha + '"', src)
          open(path, "w").write(src)
          print("Stamped versionCode " + run + ", versionName 1.0+" + sha)
          EOF

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: mv frontend/android/app/build/outputs/apk/debug/app-debug.apk "frontend/android/app/build/outputs/apk/debug/DairyFarm-v1.0+${SHORT_SHA}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: DairyFarm-v1.0+${{ env.SHORT_SHA }}
          path: frontend/android/app/build/outputs/apk/debug/DairyFarm-v1.0+${{ env.SHORT_SHA }}.apk
          retention-days: 30
