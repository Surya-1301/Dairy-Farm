name: Android APK

on:
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyA8MOLox28ROHuz280s_DUSNbrqbfe9tHU
          VITE_FIREBASE_AUTH_DOMAIN: dairy-farm.tech
          VITE_FIREBASE_PROJECT_ID: raipur-dairy-farmm
          VITE_FIREBASE_STORAGE_BUCKET: raipur-dairy-farmm.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 863738451406
          VITE_FIREBASE_APP_ID: 1:863738451406:web:1ee394f2d413877fe1479f
          VITE_FIREBASE_MEASUREMENT_ID: G-7HF9VYZM9E
          VITE_OWNER_EMAIL: dairyfarrmm@gmail.com
          VITE_APP_URL: https://dairy-farm-qlw1.onrender.com
          VITE_CLOUDINARY_CLOUD_NAME: dbdl4pjd9
          VITE_CLOUDINARY_UPLOAD_PRESET: default
          VITE_EMAILJS_SERVICE_ID: service_ymyr4jt
          VITE_EMAILJS_TEMPLATE_ID: template_8p790np
          VITE_EMAILJS_RESET_TEMPLATE_ID: template_th02oar
          VITE_EMAILJS_PUBLIC_KEY: zU3lG0MNPbyxfBUzg
          VITE_RESET_SERVER_URL: https://dairy-farm-1-a3vw.onrender.com

      - name: Sync Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: dairy-farm-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
