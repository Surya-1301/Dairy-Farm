name: Android APK

on:
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyA8MOLox28ROHuz280s_DUSNbrqbfe9tHU
          VITE_FIREBASE_AUTH_DOMAIN: dairy-farm.tech
          VITE_FIREBASE_PROJECT_ID: raipur-dairy-farmm
          VITE_FIREBASE_STORAGE_BUCKET: raipur-dairy-farmm.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 863738451406
          VITE_FIREBASE_APP_ID: 1:863738451406:web:1ee394f2d413877fe1479f
          VITE_FIREBASE_MEASUREMENT_ID: G-7HF9VYZM9E
          VITE_OWNER_EMAIL: dairyfarrmm@gmail.com
          VITE_APP_URL: https://dairy-farm-qlw1.onrender.com
          VITE_CLOUDINARY_CLOUD_NAME: dbdl4pjd9
          VITE_CLOUDINARY_UPLOAD_PRESET: default
          VITE_EMAILJS_SERVICE_ID: service_ymyr4jt
          VITE_EMAILJS_TEMPLATE_ID: template_8p790np
          VITE_EMAILJS_RESET_TEMPLATE_ID: template_th02oar
          VITE_EMAILJS_PUBLIC_KEY: zU3lG0MNPbyxfBUzg
          VITE_RESET_SERVER_URL: https://dairy-farm-1-a3vw.onrender.com

      - name: Sync Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          # Native Google sign-in (@capacitor-firebase/authentication) needs the
          # real google-services.json from Firebase Console at android/app/.
          # Upload it once as a repo secret (Settings → Secrets → Actions):
          #   GOOGLE_SERVICES_JSON = full contents of google-services.json
          # for the Android app with package com.dairyfarm.app.
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written from secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — native Google sign-in will fail until it is added. Email/password sign-in still works."
          fi
          # Apply the Google Services Gradle plugin (idempotent markers).
          grep -q "google-services" android/build.gradle || sed -i "s|classpath 'com.android.tools.build:gradle:[^']*'|classpath 'com.android.tools.build:gradle:8.5.2'\n        classpath 'com.google.gms:google-services:4.4.2'|" android/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle || sed -i "s|^apply plugin: 'com.android.application'|apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'|" android/app/build.gradle
          # variables.gradle: include the Google provider deps for the plugin.
          if [ -f android/variables.gradle ]; then
            grep -q "rgcfaIncludeGoogle" android/variables.gradle || printf '\next {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = "1.3.0"\n}\n' >> android/variables.gradle
          fi
          npx cap sync android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: dairy-farm-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
